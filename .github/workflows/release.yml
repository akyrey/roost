name: Release

# Builds the macOS universal app and dmg (task 8.20) and the Linux deb, rpm and AppImage for
# x86_64 and arm64 (D-035). A tag `v*` publishes a draft release with every package; a manual
# run only uploads the packages as workflow artifacts.
#
# Signing and notarisation run when these repository secrets are set (see docs/RELEASING.md):
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID.
# Without them the build is unsigned, which is fine for testing but Gatekeeper will warn.
#
# In-app updates (D-036) need TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# if the key has one; unset, it is an empty password). With it, every bundle is signed for the updater and the release gets a
# `latest.json`. A tag build fails without it, since installed copies could not update from it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS universal
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "UPDATER_CONFIG=--config=$GITHUB_WORKSPACE/apps/desktop/src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: installed copies could not update to this release"
            exit 1
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater bundles"
          fi
      - name: Build (signed and notarised when the Apple secrets are set)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri signs whenever these variables exist, even when empty, and an unset secret
          # arrives as an empty string: drop the empty ones so an unsigned build stays unsigned.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          pnpm tauri build --target universal-apple-darwin $UPDATER_CONFIG
      - name: Check the bundle
        working-directory: target/universal-apple-darwin/release/bundle
        env:
          SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          archs=$(lipo -archs macos/Dunlin.app/Contents/MacOS/*)
          echo "architectures: $archs"
          [[ $archs == *x86_64* && $archs == *arm64* ]]
          if [ "$SIGNED" = "true" ]; then
            codesign --verify --deep --strict macos/Dunlin.app
            spctl --assess --type execute macos/Dunlin.app
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dunlin-macos-universal
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }}
    # The oldest supported Ubuntu LTS: the packages need its glibc (2.35) or newer.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          # libfuse2 runs the AppImage tooling; xvfb runs the installed app for the smoke test.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libfuse2 file rpm xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "UPDATER_CONFIG=--config=$GITHUB_WORKSPACE/apps/desktop/src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: installed copies could not update to this release"
            exit 1
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater bundles"
          fi
      - name: Build (tauri.linux.conf.json selects deb, rpm and AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build $UPDATER_CONFIG
      - name: Check the packages
        working-directory: target/release/bundle
        run: |
          dpkg-deb --info deb/*.deb
          dpkg-deb --contents deb/*.deb | grep -E 'usr/bin/dunlin$'
          dpkg-deb --contents deb/*.deb | grep -E 'usr/share/applications/Dunlin.desktop$'
          rpm -qip rpm/*.rpm
          rpm -qlp rpm/*.rpm | grep -E '^/usr/bin/dunlin$'
          test -x appimage/*.AppImage
      - name: Install the deb and start the app
        working-directory: target/release/bundle
        run: |
          sudo apt-get install -y ./deb/*.deb
          # No keyring runs here: the app must still start (D-035). Still running after
          # 15 seconds, killed by `timeout` (124), means it started.
          set +e
          timeout 15 xvfb-run -a dunlin
          status=$?
          set -e
          test "$status" -eq 124 || { echo "dunlin exited with $status"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dunlin-linux-${{ matrix.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/*/*.sig
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Collect the files, the updater manifest and the checksums
        run: |
          # Artifacts keep their deb/, rpm/ and appimage/ folders; the release takes plain files.
          mkdir release signatures
          find packages -type f -exec mv -t release {} +
          awk '/^## \[/{n++} n==1' CHANGELOG.md > notes.md
          # The in-app prompt shows the changes without the version heading.
          tail -n +2 notes.md > update-notes.md
          node apps/desktop/scripts/updater-manifest.mjs release "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" update-notes.md
          # The signatures are inside latest.json; the release does not need them as files.
          mv release/*.sig signatures/
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -l release
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Dunlin $GITHUB_REF_NAME" \
            --notes-file notes.md \
            release/*
